<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ארז - המשחק</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4e4a6;--ink:#3b2a14;--link:#0b5fa5;--btn:#e4572e;box-sizing:border-box;color-scheme:light;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
font-family:'Secular One','Rubik','Arial Hebrew',Arial,sans-serif;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
#start{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:1.5rem;text-align:center}
h1{margin:0;font-size:clamp(2rem,12vw,7rem);white-space:nowrap;line-height:1.05;font-weight:400;text-shadow:3px 3px 0 rgba(59,42,20,.15)}
h1 span{display:inline-block}
#start a{color:var(--link);font-size:1.3rem;max-width:90vw}
#go,#again{font:inherit;font-size:2rem;padding:.55em 1.8em;border:0;border-radius:999px;background:var(--btn);color:#fff;
box-shadow:0 6px 0 #a63a1c;cursor:pointer}
#go:active,#again:active{transform:translateY(4px);box-shadow:0 2px 0 #a63a1c}
#go:focus-visible,#start a:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
#game{height:100%;display:flex;padding-top:54px}
#tray{width:70px;flex:none;height:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;
gap:10px;padding:12px 0;background:rgba(59,42,20,.09);scrollbar-width:none}
#tray::-webkit-scrollbar{display:none}
.food{width:50px;height:50px;flex:none;touch-action:pan-y;cursor:grab;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.food svg{width:100%;height:100%;display:block;pointer-events:none}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;perspective:800px;padding:calc(var(--s)*.36) 6vw calc(72px + var(--s)*.1)}
#tilt{width:var(--s);aspect-ratio:640/636;transform-style:preserve-3d;will-change:transform;filter:drop-shadow(0 22px 18px rgba(59,42,20,.4))}
#face{position:relative;width:100%;height:100%}
#face img{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;-webkit-user-drag:none}
#mouth{position:absolute;left:33.59%;top:64.78%;width:41.41%;height:19.34%;opacity:0;transition:opacity .05s;
background:linear-gradient(#1c0509,#4a1220);border-radius:0 0 50% 50%/0 0 56% 56%;clip-path:polygon(0 28.2%,100% 10.5%,100% 100%,0 100%);filter:blur(.6px)}
#jaw{position:absolute;left:23.44%;top:64.78%;width:60.94%;height:24.84%;background-repeat:no-repeat;background-size:164.06% 402.5%;
background-position:60% 86.19%;clip-path:polygon(0 25.3%,100% 5.1%,100% 100%,0 100%);
-webkit-mask-image:radial-gradient(ellipse 50% 66% at 50% 26%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 50% 66% at 50% 26%,#000 70%,transparent 100%);
transition:transform .16s cubic-bezier(.2,.8,.3,1)}
#face.open #mouth{opacity:1}
#face.open #jaw{transform:translateY(36%)}
#face.chew #jaw{animation:chewjaw .45s ease-in-out}
@keyframes chewjaw{0%,100%{transform:translateY(36%)}25%{transform:translateY(11%)}50%{transform:translateY(32%)}75%{transform:translateY(13%)}}
#face.chew{animation:chew .45s ease-in-out}
@keyframes chew{25%{transform:scale(1.04,.97)}50%{transform:scale(.98,1.03)}75%{transform:scale(1.03,.98)}}
.fly{position:fixed;left:0;top:0;width:62px;height:62px;pointer-events:none;z-index:9;filter:drop-shadow(0 6px 4px rgba(0,0,0,.3));
transition:opacity .2s,scale .22s}
.fly svg{width:100%;height:100%;display:block}
.fly.gone{opacity:0;scale:.2}
@media (prefers-reduced-motion:reduce){#face.chew{animation:none}}
#acc{width:70px;flex:none;height:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;
padding:12px 0;background:rgba(59,42,20,.09);scrollbar-width:none;visibility:hidden;opacity:0;translate:-34px 0;scale:.85}
#acc::-webkit-scrollbar{display:none}
#acc.on{visibility:visible;opacity:1;translate:0 0;scale:1;transition:translate .5s cubic-bezier(.2,1.4,.4,1),scale .5s cubic-bezier(.2,1.4,.4,1),opacity .3s}
.ai{position:relative;width:54px;height:54px;flex:none;border-radius:12px;background:rgba(255,255,255,.55);border:2px solid transparent;padding:5px;cursor:pointer}
.ai.sel{border-color:var(--btn);background:#fff}
.ai svg{width:100%;height:100%;display:block;overflow:visible}
.ai.lock{cursor:default}.ai.lock svg{filter:grayscale(1) brightness(.6);opacity:.6}
.ai small{position:absolute;left:0;right:0;bottom:3px;font-size:10px;text-align:center;color:var(--ink)}
.acs{position:absolute;pointer-events:none}.acs svg{width:100%;height:100%;display:block;overflow:visible}
#xp{position:fixed;left:50%;translate:-50% 0;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(60vw,420px);text-align:center;z-index:5}
#xpl{font-size:.95rem;margin-bottom:4px}
#xpt{height:16px;border-radius:99px;background:rgba(59,42,20,.2);overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
#xpf{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#43c06a,#f6c945,#ef7d2a);transition:width .4s}
#combo,#toast{position:fixed;left:50%;translate:-50% 0;text-align:center;pointer-events:none;z-index:6;opacity:0;white-space:nowrap}
#combo{top:calc(16px + env(safe-area-inset-top,0px));font-size:clamp(1.7rem,8vw,2.8rem);color:#d62839;text-shadow:2px 2px 0 #fff,0 4px 8px rgba(0,0,0,.2)}
#combo.show{opacity:1;animation:pop .28s}
#toast{top:calc(74px + env(safe-area-inset-top,0px));font-size:1.2rem;color:#fff;background:rgba(59,42,20,.9);padding:.4em 1em;border-radius:14px;white-space:normal;max-width:88vw}
#toast.show{animation:toast 2.8s forwards}
@keyframes pop{0%{scale:.6}60%{scale:1.2}100%{scale:1}}
@keyframes toast{0%{opacity:0;scale:.7}8%{opacity:1;scale:1.08}14%{scale:1}88%{opacity:1}100%{opacity:0}}
#game{--s:max(120px,min(calc(100vw - 140px - 12vw),calc((100vh - 384px)/1.46),380px))}
@supports (height:100dvh){#game{--s:max(120px,min(calc(100vw - 140px - 12vw),calc((100dvh - 384px)/1.46),380px))}}
#menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);inset-inline-start:8px;z-index:8}
#mb{width:44px;height:44px;border:0;border-radius:12px;background:rgba(59,42,20,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;cursor:pointer}
#mb i{display:block;width:24px;height:3px;border-radius:2px;background:var(--ink)}
#mp{position:absolute;top:50px;inset-inline-start:0;min-width:210px;background:#fffaf0;border-radius:14px;box-shadow:0 8px 24px rgba(59,42,20,.35);padding:6px;display:none}
#mp.open{display:block}
#mp button{display:block;width:100%;text-align:start;font:inherit;font-size:1.05rem;color:var(--ink);background:none;border:0;padding:.75em .8em;border-radius:10px;cursor:pointer}
#mp button:active{background:rgba(59,42,20,.12)}
#bye{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:1.5rem;text-align:center;font-size:1.7rem}
#choice{position:fixed;inset:0;background:rgba(59,42,20,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:1.5rem}
#cbox{background:var(--bg);border-radius:20px;padding:1.4rem;display:flex;flex-direction:column;gap:.9rem;text-align:center;font-size:1.5rem;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.4)}
#cinfo{font-size:1.05rem}
.cb{font:inherit;font-size:1.2rem;padding:.7em 1em;border:0;border-radius:999px;background:var(--btn);color:#fff;cursor:pointer;box-shadow:0 5px 0 #a63a1c}
.cb.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(59,42,20,.3)}
.cb:active{transform:translateY(3px)}
</style>
</head>

function enterGame(){

  document.getElementById('start').hidden=true;document.getElementById('game').hidden=false;
  startSnd.volume=1;startSnd.currentTime=0;startSnd.play().catch(()=>{});
  [comboSnd,levelSnd].forEach(v=>{v.muted=true;v.play().then(()=>{v.pause();v.currentTime=0;v.muted=soundOff}).catch(()=>{v.muted=soundOff})});
  VOICES.forEach(v=>{v.muted=true;v.play().then(()=>{v.pause();v.currentTime=0;v.muted=soundOff}).catch(()=>{v.muted=soundOff})});

}

let pending=null,drag=null,mouthTimer=0;
const tilt=document.getElementById('tilt');let rx=0,ry=0;
(function loop(t){let ty,tx;
 if(drag&&drag.px!=null){const r=tilt.getBoundingClientRect();
  ty=Math.max(-1,Math.min(1,(drag.px-(r.left+r.width/2))/r.width))*28;
  tx=-Math.max(-1,Math.min(1,(drag.py-(r.top+r.height/2))/r.height))*22}
 else{ty=Math.sin(t/1100)*9;tx=Math.cos(t/1500)*5}
 ry+=(ty-ry)*.12;rx+=(tx-rx)*.12;
 tilt.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;requestAnimationFrame(loop)})(0);
tray.addEventListener('pointerdown',e=>{
  const f=e.target.closest('.food');if(!f)return;
  pending={svg:f.innerHTML,x:e.clientX,y:e.clientY,id:e.pointerId};
});
function startDrag(e){
  const el=document.createElement('div');el.className='fly';el.innerHTML=pending.svg;document.body.appendChild(el);
  drag={el,id:pending.id};pending=null;place(e);
}
function place(e){drag.px=e.clientX;drag.py=e.clientY;drag.el.style.transform=`translate(${e.clientX-31}px,${e.clientY-31}px)`;
  const r=mouth.getBoundingClientRect(),fr=face.getBoundingClientRect();
  const d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));
  drag.over=d<fr.width*0.3;face.classList.toggle('open',drag.over);
}
window.addEventListener('pointermove',e=>{
  if(pending&&e.pointerId===pending.id){
    const dx=Math.abs(e.clientX-pending.x),dy=Math.abs(e.clientY-pending.y);
    if(e.pointerType==='mouse'?Math.max(dx,dy)>5:(dx>8&&dx>dy))startDrag(e);
  }
  if(drag&&e.pointerId===drag.id)place(e);
});
function finish(e,cancel){
  if(pending&&e.pointerId===pending.id)pending=null;
  if(!drag||e.pointerId!==drag.id)return;
  const {el,over}=drag;drag=null;
  el.classList.add('gone');setTimeout(()=>el.remove(),260);
  if(over&&!cancel){
    face.classList.remove('chew');void face.offsetWidth;face.classList.add('chew');onFeed();
    say();
    clearTimeout(mouthTimer);mouthTimer=setTimeout(()=>face.classList.remove('open','chew'),600);
  }else face.classList.remove('open');
}
window.addEventListener('pointerup',e=>finish(e,false));
window.addEventListener('pointercancel',e=>finish(e,true));
document.addEventListener('contextmenu',e=>e.preventDefault());

const worn={},accEl=document.getElementById('acc'),comboEl=document.getElementById('combo'),toastEl=document.getElementById('toast');
function renderWorn(){face.querySelectorAll('.acs').forEach(n=>n.remove());
 ACC.forEach(a=>{if(worn[a.slot]===a.id){const d=document.createElement('div');d.className='acs';d.style.cssText=a.pos;d.innerHTML=a.svg;face.appendChild(d)}})}
function renderAcc(){accEl.innerHTML='';
 ACC.forEach(a=>{const ok=lvl>=a.lv,d=document.createElement('div');
  d.className='ai'+(ok?'':' lock')+(worn[a.slot]===a.id?' sel':'');d.title=a.n;d.innerHTML=a.svg+(ok?'':`<small>שלב ${a.lv}</small>`);
  if(ok)d.onclick=()=>{worn[a.slot]=worn[a.slot]===a.id?null:a.id;renderAcc();renderWorn();save()};accEl.appendChild(d)})}

/* xp, combo, levels */
let xp=0,lvl=1,combo=0,lastFeed=0,comboT=0;
const need=()=>90+lvl*30;
function setXP(){document.getElementById('xpf').style.width=Math.min(100,xp/need()*100)+'%';document.getElementById('xpl').textContent=`שלב ${lvl} · ${xp}/${need()}`}
function pop(el,txt){el.textContent=txt;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function levelUp(){skipSay=true;comboSnd.pause();levelSnd.volume=1;levelSnd.currentTime=0;levelSnd.play().catch(()=>{});const got=ACC.filter(a=>a.lv===lvl).map(a=>a.n);
 pop(toastEl,`שלב ${lvl}!`+(got.length?` נפתח: ${got.join(' + ')}`:''));
 accEl.classList.add('on');renderAcc()}
function onFeed(){const now=Date.now();combo=now-lastFeed<2200?combo+1:1;lastFeed=now;
 xp+=Math.round(10*(1+Math.min(combo-1,8)*.2));
 if(combo>=2)pop(comboEl,`קומבו x${combo}!`);
 if(combo===2){skipSay=true;comboSnd.volume=1;comboSnd.currentTime=0;comboSnd.play().catch(()=>{})}
 clearTimeout(comboT);comboT=setTimeout(()=>{combo=0;comboEl.classList.remove('show')},2200);
 while(xp>=need()){xp-=need();lvl++;levelUp()}
 setXP();save()}
renderAcc();setXP();

/* menu */
let soundOff=false;
const allAudio=()=>[startSnd,comboSnd,levelSnd,bgm,...VOICES];
const mp=document.getElementById('mp'),m1=document.getElementById('m1'),startEl=document.getElementById('start'),gameEl=document.getElementById('game'),byeEl=document.getElementById('bye');
const stopAudio=()=>allAudio().forEach(a=>{try{a.pause();a.currentTime=0}catch(e){}});
document.getElementById('mb').addEventListener('click',e=>{e.stopPropagation();mp.classList.toggle('open')});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu'))mp.classList.remove('open')});
m1.addEventListener('click',()=>{soundOff=!soundOff;allAudio().forEach(a=>{a.muted=soundOff});if(soundOff)stopAudio();
 m1.textContent=soundOff?'הפעל צליל':'השתק צליל';mp.classList.remove('open')});
document.getElementById('m2').addEventListener('click',()=>{stopAudio();mp.classList.remove('open');gameEl.hidden=true;startEl.hidden=false;tryBgm(true)});
document.getElementById('m3').addEventListener('click',()=>{needChoice=true;stopAudio();mp.classList.remove('open');try{window.close()}catch(e){}gameEl.hidden=true;byeEl.hidden=false});
document.getElementById('again').addEventListener('click',()=>{byeEl.hidden=true;startEl.hidden=false;tryBgm(true)});

/* saved progress */
const KEY='erez-game-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({xp,lvl,worn}))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');
 if(s&&Number.isFinite(s.xp)&&Number.isFinite(s.lvl)&&s.lvl>=1){xp=s.xp;lvl=s.lvl;Object.assign(worn,s.worn||{});
  if(lvl>=2)accEl.classList.add('on');renderAcc();renderWorn();setXP()}}catch(e){}
const hasProgress=()=>xp>0||lvl>1;
let needChoice=hasProgress();
const choiceEl=document.getElementById('choice');
document.getElementById('go').addEventListener('click',()=>{
 if(needChoice&&hasProgress()){document.getElementById('cinfo').textContent=`שלב ${lvl}`;choiceEl.hidden=false}else enterGame()});
document.getElementById('c1').addEventListener('click',()=>{needChoice=false;choiceEl.hidden=true;enterGame()});
document.getElementById('c2').addEventListener('click',()=>{
 xp=0;lvl=1;combo=0;Object.keys(worn).forEach(k=>delete worn[k]);accEl.classList.remove('on');
 renderAcc();renderWorn();setXP();save();needChoice=false;choiceEl.hidden=true;enterGame()});

/* home-screen music: loops quietly, stops when the game starts */
function tryBgm(g){if(startEl.hidden||soundOff)return;
 if(g)bgm.muted=false;
 if(bgm.paused)bgm.play().catch(()=>{bgm.muted=true;bgm.play().catch(()=>{})})}
tryBgm();
['pointerup','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,e=>{
 if(e.target.closest&&e.target.closest('#go,#choice'))return;tryBgm(true)},true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm.pause();else tryBgm()});
</script>
